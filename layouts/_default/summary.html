<article class="post-preview">
  <header>
    <h2 class="title"><a href="{{ .Permalink }}"> {{ .Title }}</a></h2>
    <div class="meta">
      <time
        datetime="{{ .Date.Format "2006-01-02T15:04:05-0800" }}"
        class="date"
      >
        {{ .Date.Format "2006-01-02" }}
      </time>
      {{ partial "tags.html" . }}
    </div>
  </header>

  <div class="summary">
    {{ .Summary }}
  </div>

  <div class="rmore">
    <a href="{{ .Permalink }}" class="rmore">Read more</a>
  </div>
</article>
